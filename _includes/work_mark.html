{%- assign mark = include.mark | default: "bounded-stack" -%}
<span class="eh-work-mark eh-work-mark--{{ mark }}" aria-hidden="true">
  {%- case mark -%}
    {%- when "bounded-stack" -%}
      <svg viewBox="0 0 24 24" fill="none" focusable="false">
        <rect x="5" y="4" width="14" height="16" rx="2.5"></rect>
        <path d="M8 8.5h8"></path>
        <path d="M8 12h8"></path>
        <path d="M8 15.5h5"></path>
        <path d="M4 7.5v9"></path>
        <path d="M20 7.5v9"></path>
      </svg>
    {%- when "control-loop" -%}
      <svg viewBox="0 0 24 24" fill="none" focusable="false">
        <rect x="5" y="6" width="14" height="9" rx="2"></rect>
        <path d="M9 19h6"></path>
        <path d="M12 15v4"></path>
        <path d="M8.5 10.5a4 4 0 0 1 6.4-2.8"></path>
        <path d="M15.5 7.5h-1.1v1.1"></path>
        <path d="M15.5 10.5a4 4 0 0 1-6.4 2.8"></path>
        <path d="M8.5 13.5h1.1v-1.1"></path>
      </svg>
    {%- when "ranking-ladder" -%}
      <svg viewBox="0 0 24 24" fill="none" focusable="false">
        <path d="M6 17.5h4"></path>
        <path d="M6 12h7"></path>
        <path d="M6 6.5h11"></path>
        <path d="M10 17.5l3-5.5 4-5.5"></path>
        <circle cx="6" cy="17.5" r="1"></circle>
        <circle cx="6" cy="12" r="1"></circle>
        <circle cx="6" cy="6.5" r="1"></circle>
      </svg>
    {%- when "team-plan" -%}
      <svg viewBox="0 0 24 24" fill="none" focusable="false">
        <circle cx="7" cy="7.5" r="2"></circle>
        <circle cx="17" cy="7.5" r="2"></circle>
        <rect x="5" y="15" width="4" height="4" rx="1"></rect>
        <rect x="15" y="15" width="4" height="4" rx="1"></rect>
        <path d="M7 9.5v5.5"></path>
        <path d="M17 9.5v5.5"></path>
        <path d="M9 17h6"></path>
        <path d="M9 7.5h6"></path>
      </svg>
    {%- else -%}
      <svg viewBox="0 0 24 24" fill="none" focusable="false">
        <rect x="5" y="5" width="14" height="14" rx="2.5"></rect>
        <path d="M8 12h8"></path>
      </svg>
  {%- endcase -%}
</span>
