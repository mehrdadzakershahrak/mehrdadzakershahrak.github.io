- title: "Human–robot teaming and progressive explanation"
  period: "2018–2021"
  field: "Human–AI interaction · planning · reinforcement learning"
  image: "/assets/images/research/human-robot-teaming.webp"
  image_alt: "Editorial illustration of a person and robot building a shared plan through progressive explanation layers"
  summary: "Explanations should follow how people build understanding—not merely expose a machine’s internal rationale. This work models explanation as a progressive, preference-sensitive process for teammates coordinating around plans."
