- title: "Hardware roots of trustworthy systems"
  period: "2016–2017"
  field: "Hardware security · physical unclonable functions"
  image: "/assets/images/research/hardware-trust.webp"
  image_alt: "Editorial illustration of a silicon fingerprint protecting two authenticated signal streams inside a hardware enclave"
  summary: "Before learned systems can be trusted, their hardware identity and data paths must be protected. This work uses physical unclonable functions and hardware isolation to authenticate devices and streams with low overhead and resist modeling or denial-of-service attacks."
