title: Mehrdad Zaker
description: Founder and principal-level AI engineer building trustworthy AI systems from research through production.
baseurl: ""
url: "https://www.mehrdadzaker.com"
markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax
  math_engine_opts:
    preview: true

# Minimal Mistakes (GitHub Pages compatible)
remote_theme: "mmistakes/minimal-mistakes@4.27.3"
minimal_mistakes_skin: "default"
plugins:
  - jekyll-include-cache
  - jekyll-sitemap

exclude:
  - .bundle/
  - .bundle
  - .jekyll-cache/
  - .jekyll-cache
  - _site/
  - _site
  - Gemfile
  - Gemfile.lock
  - gemfiles/
  - gemfiles
  - auth-service
  - MythosBridge/
  - MythosBridge
  - node_modules/
  - node_modules
  - assets/js/lunr
  - assets/js/lunr/**
  - auth-service/
  - auth-service/**
  - node_modules/**
  - package-lock.json
  - package.json
  - playwright.config.js
  - README.md
  - test-results/
  - tests/
  - tools/
  - vendor/

collections:
  ai_material:
    output: true
  podcast_entries:
    output: true
    permalink: /podcast/:name/

defaults:
  - scope:
      path: ""
      type: ai_material
    values:
      layout: single
      classes: wide ai-material-page
      toc: true
      toc_label: "On this page"
      author: "Mehrdad Zaker"
  - scope:
      path: ""
      type: podcast_entries
    values:
      layout: podcast_entry
      classes: wide podcast-entry-page

# Site features
search: false

# Site-specific settings
contact_email: "mehrdadz@neuralint.io"
logo_mark: "/assets/images/logo-mark.svg"
default_social_image: "/assets/images/mehrdad-zaker-headshot.jpeg"
default_social_image_alt: "Portrait of Mehrdad Zaker"
default_social_image_width: 1122
default_social_image_height: 1402

# Newsletter (Substack) (set this)
substack_subscribe_url: ""
